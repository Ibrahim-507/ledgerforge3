# Runs on every push and every pull request. It protects the main branch: a change that breaks payroll, the ledger, security or the
# Docker image is caught in minutes, before anyone merges it or deploys it.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Use the seed data as test data
        run: cp -r seed data
      - name: Tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing
        env:
          LEDGERFORGE_SECRET_KEY: ci-only-test-key-0123456789-abcdefghijklmnop   # a throw-away value for tests, not a real secret

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t ledgerforge:ci .
      - name: No secret or database inside the image
        run: |
          docker run --rm --entrypoint sh ledgerforge:ci -c '
            for f in /app/.env /app/.secret_key; do test ! -e "$f" || { echo "FOUND $f"; exit 1; }; done
            test -z "$(find /app /var/lib/ledgerforge -name "*.sqlite*" 2>/dev/null)" || { echo "database inside image"; exit 1; }
            echo "image is clean"'
